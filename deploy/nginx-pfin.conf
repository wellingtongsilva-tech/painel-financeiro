# Publica o painel em iaiabrasil.com/pfin
# Adicione este bloco DENTRO do server { } (443/ssl) do vhost iaiabrasil.com.
# Depois: nginx -t && systemctl reload nginx
#
# IMPORTANTE: use "^~" (e nao apenas "/pfin/"). No vhost do iaiabrasil.com ha
# locations regex de cache para js/css/svg/ico; sem o "^~" o /pfin/app.js e o
# /pfin/styles.css cairiam nesses regex (regex vence prefixo simples) e dariam
# 404. O "^~" faz este prefixo ganhar do regex, igual ao /projetoeditais/.

location = /pfin { return 301 /pfin/; }

location ^~ /pfin/ {
    # A barra final no proxy_pass remove o prefixo /pfin/ antes de repassar,
    # entao o app (que usa caminhos relativos) funciona normalmente.
    proxy_pass http://127.0.0.1:8090/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
