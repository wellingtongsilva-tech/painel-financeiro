# Publica o painel em iaiabrasil.com/pfin
# Adicione este bloco DENTRO do server { } (443/ssl) do vhost iaiabrasil.com.
# No HestiaCP: use um arquivo de include do vhost, por ex.:
#   /home/<user>/conf/web/iaiabrasil.com/nginx.ssl.conf_pfin
# e depois: nginx -t && systemctl reload nginx

location = /pfin { return 301 /pfin/; }

location /pfin/ {
    # A barra final no proxy_pass remove o prefixo /pfin/ antes de repassar,
    # então o app (que usa caminhos relativos) funciona normalmente.
    proxy_pass http://127.0.0.1:8090/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
