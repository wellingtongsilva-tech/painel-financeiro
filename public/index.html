<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0c0e12" media="(prefers-color-scheme: dark)" />
  <title>Meu Painel</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Meu Painel" />
  <script>
    (function () {
      var t = localStorage.getItem('painel-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Tela de login (token de acesso) -->
  <div id="auth" class="auth hidden">
    <div class="auth-card">
      <div class="brand"><span class="brand-mark">◆</span> Meu Painel</div>
      <p class="auth-sub">Pessoal · Empresa · Rotina · Finanças</p>

      <form id="form-login" class="auth-form">
        <label>Senha de acesso
          <input type="password" name="token" autocomplete="current-password" required autofocus placeholder="sua senha" />
        </label>
        <button class="btn-primary" type="submit">Entrar</button>
      </form>

      <p id="auth-error" class="error"></p>
    </div>
  </div>

  <!-- App -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="topbar-title" id="topbar-title">Agora</div>
      <div class="topbar-actions">
        <button id="btn-settings" class="icon-btn" title="Configurações">⚙︎</button>
        <button id="btn-logout" class="icon-btn" title="Sair">⏻</button>
      </div>
    </header>

    <div class="ambito-bar" id="ambito-bar">
      <button class="amb-btn on" data-amb="pessoal"><span class="dot"></span>Pessoal</button>
      <button class="amb-btn" data-amb="empresa"><span class="dot"></span>Empresa</button>
    </div>

    <main id="view" class="view"></main>

    <nav class="tabbar">
      <button class="tabbar-btn active" data-view="hoje" aria-label="Agora">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg>Agora</button>
      <button class="tabbar-btn" data-view="tarefas" aria-label="Tarefas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Tarefas</button>
      <button class="tabbar-btn" data-view="financas" aria-label="Finanças">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Finanças</button>
      <button class="tabbar-btn" data-view="autocuidado" aria-label="Rotina">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>Rotina</button>
    </nav>
  </div>

  <!-- Modal genérico -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head"><h3 id="modal-title"></h3><button id="modal-close" class="icon-btn">✕</button></div>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
